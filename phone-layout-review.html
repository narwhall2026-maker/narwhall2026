adow:0 0 0 1px #edf7ff88,0 12px 28px #0007,inset 0 0 0 2px #293443;\n}\n#wall[data-frame=\"pastel\"],#peekContent[data-frame=\"pastel\"] {\n border:10px solid #b5b1ff;border-image:linear-gradient(140deg,#98f5ec,#aaa5ff 18%,#ffb9e0 35%,#fff3ae 49%,#9cebdc 63%,#b6a2ff 79%,#f7b9d8) 1;border-radius:5px;\n box-shadow:0 0 18px #bc9cff55,0 12px 28px #0006,inset 0 0 0 2px #e4d8ff77;\n}\n#wall[data-frame=\"neon\"],#peekContent[data-frame=\"neon\"] {\n border:4px solid #ff72d8;border-radius:24px;\n box-shadow:0 0 0 3px #20132f,0 0 0 5px #7eeaff,0 0 22px #c74bff88,inset 0 0 16px #ff5acb44;\n}\n\n/* A continuous wall: stable rows, playful Polaroid angles, more as you scroll. */\n#communityScreen {max-width:900px;margin:0 auto;padding:20px 20px calc(110px + env(safe-area-inset-bottom,0px));}\n.community-heading {display:flex;align-items:center;justify-content:space-between;gap:12px;}\n.community-heading h2 {font-family:'Caveat',cursive;font-size:36px;line-height:1.1;margin:0 0 8px;}\n.community-heading p {font-size:13px;color:#aaa9ae;margin:0;}\n.community-heading button {padding:10px 12px;border:1px solid #41434d;border-radius:14px;background:#191c24;color:#eee3d2;font-size:12px;}\n.community-note {font-size:12px;color:#aaa9ae;line-height:1.7;margin:18px 0;}\n#communityCaptureButton {display:block;margin:0 auto 26px;padding:13px 22px;min-height:48px;background:#f3e8d6;color:#28231e;border:0;border-radius:24px;font-weight:600;box-shadow:0 4px 0 #9a8970;}\n#communityWall {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 24px;padding:24px 18px;min-height:300px;background:#171a22;border:1px solid #30343d;border-radius:24px;isolation:isolate;}\n#communityWall>.wall-message {grid-column:1/-1;align-self:center;}\n.community-card {position:relative;align-self:start;min-width:0;padding:10px 10px 13px;background:#f2eee4;color:#302b28;transform:rotate(var(--card-tilt,0deg));box-shadow:0 8px 16px #0006;border-radius:2px;}\n.community-card img,.community-photo-error {disp :350px){\n .logo {font-size:28px;}\n .community-link {font-size:11px;padding:10px;}\n .moments-sticker {padding:8px;}\n .moments-sticker span:first-child {font-size:20px;}\n .moments-sticker span:last-child {font-size:13px;}\n .wall-tools summary {font-size:12px;padding:10px 8px;}\n .wall-tools .rename-wall {font-size:11px;padding:10px 6px;}\n}\n@media(max-height:500px) and (max-width:900px){.capture-polaroid #photoPreview img {max-height:30dvh;}.choose-photo {min-height:130px;}}\n@media(prefers-reduced-motion:reduce){*,*::before,*::after {transition:none!important;scroll-behavior:auto!important;}}\n</style>\n</head>\n<body data-screen=\"wall\">\n  <main class=\"app\">\n    <header>\n      <div class=\"brand-area\"><div class=\"logo\">\ud83d\udc0b Narwhall</div><button id=\"communityButton\" class=\"community-link\" data-screen=\"community\" onclick=\"showScreen('community')\" aria-pressed=\"false\">\ud83c\udf0d Community wall</button></div>\n      <button id=\"profileButton\" class=\"profile-button\" aria-label=\"Profile\">\ud83d\udc64</button>\n    <section id=\"intro\" class=\"intro\">\n      <aside class=\"moments-sticker\" aria-label=\"My moments are worth capturing\"><span>my moments</span><span>are worth capturing</span></aside>\n    </section>\n    </header>\n\n\n\n    <section id=\"wallControls\">\n      <div class=\"wall-tabs\"><button id=\"mainWallTab\" onclick=\"setWall('main')\" aria-pressed=\"true\">My moments</button><button id=\"privateWallTab\" onclick=\"setWall('private')\" aria-pressed=\"false\">\ud83d\udd12 Locked wall</button></div>\n\n      <div class=\"wall-tools\">\n      <details id=\"personaliseWall\" class=\"personalise-wall\"><summary>\ud83c\udfa8 Personalise wall</summary>\n      <div class=\"wall-colour-control\"><label for=\"wallColour\">\ud83c\udfa8 Wall colour</label><select id=\"wallColour\"><option value=\"dark\">Dark</option><option value=\"cream\">Cream</option><option value=\"blush\">Blush pink</option><option value=\"lavender\">Lavender</option><option value=\"sky\">Sky blue</option><option value=\"sage\">Sage green</option></select></div>\n<div class=\"wall-colour-control\"><label for=\"wallBackground\">Background</label><select id=\"wallBackground\"><option value=\"plain\">Plain colour</option><option value=\"cork\">Corkboard</option><option value=\"paper\">Cosmic night</option><option value=\"dots\">Neon sunset</option></select></div>\n<div class=\"wall-colour-control\"><label for=\"wallFrame\">Outer frame</label><select id=\"wallFrame\"><option value=\"classic\">Classic dark</option><option value=\"cream\">Liquid chrome</option><option value=\"wood\">Wood</option><option value=\"pastel\">Holographic</option><option value=\"neon\">Neon arcade</option></select></div>\n<button id=\"saveWallStyleButton\" onclick=\"action(saveWallColour,this)\">Save wall style</button><p>Saved for this wall. Friends see it when they peek.</p></details>\n      <button id=\"renameWallButton\" class=\"rename-wall\" onclick=\"action(renameWall,this)\">\u270e Rename this wall</button>\n      </div>\n\n      <div id=\"memoryControls\" hidden>\n        <button onclick=\"moveMemoryWeek(-1)\">\u2190 Older week</button>\n        <label for=\"memoryDate\">Week containing</label><input id=\"memoryDate\" type=\"date\">\n        <button id=\"newerWeekButton\" onclick=\"moveMemoryWeek(1)\">Newer week \u2192</button>\n        <p id=\"memoryWeekLabel\" aria-live=\"polite\"></p>\n      </div>\n\n    </section>\n    <div id=\"photoWallFrame\">\n      <section id=\"wall\">\n        <div class=\"wall-empty\">Log in to see your moments \ud83d\udc0b</div>\n      </section>\n      <button id=\"captureButton\" class=\"capture\" onclick=\"openCapture()\" aria-label=\"Capture a moment\" title=\"Capture a moment\">\ud83d\udcf8</button>\n    </div>\n      <div id=\"privateControls\" hidden>\n        <p>Just for you, unless you invite someone for 24 hours.</p>\n        <p class=\"privacy-hint\">Only invite people you trust\u2014photos can be saved or screenshotted.</p>\n        <label for=\"privateFriend\">Let a friend see your locked wall</label>\n        <select id=\"privateFriend\"><option value=\"\">Choose a friend</option></select>\n        <button id=\"privateInviteButton\">Invite for 24 hours</button>\n        <div id=\"privateAccessList\"></div>\n      </div>\n    <section id=\"wallBrowseControls\">\n      <div class=\"wall-tabs\"><button id=\"recentTab\" onclick=\"setMemoryView(false)\" aria-pressed=\"true\">Latest 10</button><button id=\"memoriesTab\" onclick=\"setMemoryView(true)\" aria-pressed=\"false\">\ud83d\udcda Memories</button></div>\n      <p id=\"wallViewHint\" class=\"wall-view-hint\">Your newest 10 moments. Older photos stay in Memories.</p>\n    </section>\n    <button id=\"moreMemoriesButton\" hidden onclick=\"action(()=>loadMoments(true),this)\">Load more from this week</button>\n  </main>\n\n  <section id=\"communityScreen\" style=\"display:none;\">\n    <div class=\"community-heading\"><div><h2>Community wall</h2><p>Everyone's moments. One never-ending wall.</p></div><button onclick=\"action(()=>loadCommunity(true),this)\">\u21bb Refresh</button></div>\n    <p class=\"community-note\">Visible to everyone logged in to Narwhall. Post your own photos, be kind, and report anything that doesn't belong.</p>\n    <button id=\"communityCaptureButton\" onclick=\"openCapture('community')\">\ud83d\udcf8 Post a public moment</button>\n    <div id=\"communityWall\" aria-label=\"Community photos\"></div>\n    <div id=\"communitySentinel\"><p id=\"communityStatus\" role=\"status\" aria-live=\"polite\"></p><button id=\"communityMoreButton\" hidden onclick=\"action(()=>loadCommunity(false),this)\">Load more moments</button></div>\n  </section>\n\n  <div id=\"appNotice\" role=\"status\" aria-live=\"polite\" hidden></div>\n\n  <div id=\"capturePanel\" class=\"capture-panel\">\n    <div class=\"capture-box\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Capture a moment\">\n      <button class=\"close-capture\" onclick=\"closeCapture()\" aria-label=\"Close\">\u2715</button>\n      <h2 id=\"captureTitle\">Capture a moment</h2>\n      <p id=\"captureHint\">Pick a photo, add a little caption, then pin it.</p>\n      <input type=\"file\" id=\"momentPhoto\" accept=\"image/*\" class=\"capture-file\" tabindex=\"-1\" aria-label=\"Choose a photo\">\n      <div class=\"capture-polaroid\">\n        <div id=\"photoPreview\"><button id=\"choosePhotoButton\" class=\"choose-photo\" onclick=\"chooseCapturePhoto()\"><span aria-hidden=\"true\">\ud83d\udcf7</span>Choose a photo</button></div>\n        <label for=\"momentCaption\" class=\"visually-hidden\">Your caption</label>\n        <textarea id=\"momentCaption\" maxlength=\"30\" rows=\"1\" placeholder=\"Write something\u2026\" aria-describedby=\"captionCount\"></textarea>\n        <div id=\"captionCount\" class=\"word-count\"><span id=\"wordCount\">0</span>/15 characters</div>\n      </div>\n      <div id=\"captureShare\"><label for=\"shareFriend\">Select friend</label>\n        <select id=\"shareFriend\"><option value=\"\">Just me</option></select>\n      </div>\n      <div class=\"capture-actions\">\n        <button id=\"retakeButton\" onclick=\"chooseCapturePhoto()\">Choose photo</button>\n        <button id=\"pinButton\" class=\"pin-button\" onclick=\"saveMoment()\" disabled>Pin</button>\n      </div>\n    </div>\n  </div>\n\n  <section id=\"friendsScreen\" style=\"display: none;\">\n    <h2>Friends</h2>\n    <button id=\"addFriendButton\" onclick=\"addFriend()\">\u2795 Add friend</button>\n    <h3>Friend requests</h3>\n    <div id=\"friendRequests\"><p>No friend requests yet.</p></div>\n    <h3>Shared moments</h3>\n    <div id=\"sharedMomentRequests\"><p>No shared moments yet \ud83d\udc0b</p></div>\n    <h3>Locked wall invitations</h3>\n    <div id=\"privateWallInvites\"></div>\n    <h3>Your friends</h3>\n    <div id=\"friendsList\"></div>\n  </section>\n\n  <div id=\"peekScreen\" style=\"display:none;\">\n    <button onclick=\"closePeek()\">\u2190 Back</button>\n    <h2 id=\"peekTitle\">Peek \ud83d\udc40</h2>\n    <div id=\"peekContent\"></div>\n  </div>\n\n  <nav>\n    <button data-screen=\"wall\" onclick=\"showScreen('wall')\">\ud83c\udfe0 <span>Wall</span></button>\n    <button data-screen=\"friends\" onclick=\"showScreen('friends')\">\ud83d\udc65 <span>Friends</span></button>\n  </nav>\n\n  <section id=\"profileScreen\" style=\"display: none;\">\n    <h2>Profile</h2>\n    <p id=\"accountStatus\"></p>\n    <label for=\"username\">Username</label>\n    <input id=\"username\" type=\"text\" placeholder=\"Choose a username\">\n    <button id=\"saveUsernameButton\">Save username</button>\n    <div id=\"signedOutActions\">\n      <button onclick=\"showScreen('signup')\">\ud83d\udc0b Sign up</button>\n      <button onclick=\"showScreen('login')\">\ud83d\udd11 Log in</button>\n    </div>\n    <button id=\"logoutButton\" hidden>Log out</button>\n    <details id=\"communityBlockSettings\"><summary>Blocked Community accounts</summary><div id=\"communityBlockedList\"></div></details>\n  </section>\n\n  <section id=\"signupScreen\" style=\"display: none;\">\n    <button class=\"screen-back\" onclick=\"showScreen('profile')\">\u2190 Back</button>\n    <h2>Create your Narwhal account \ud83d\udc0b</h2>\n    <label for=\"signupEmail\">Email</label>\n    <input id=\"signupEmail\" type=\"email\" autocomplete=\"email\" placeholder=\"Your email\" required>\n    <label for=\"signupPassword\">Password</label>\n    <input id=\"signupPassword\" type=\"password\" autocomplete=\"new-password\" minlength=\"8\" placeholder=\"Create a password\" required>\n    <label for=\"signupUsername\">Username</label>\n    <input id=\"signupUsername\" type=\"text\" autocomplete=\"username\" minlength=\"3\" maxlength=\"24\" placeholder=\"Choose a username\" required>\n    <button id=\"signupButton\">Create account</button>\n  </section>\n\n  <section id=\"loginScreen\" style=\"display: none;\">\n    <button class=\"screen-back\" onclick=\"showScreen('profile')\">\u2190 Back</button>\n    <h2>Welcome back \ud83d\udc0b</h2>\n    <label for=\"loginEmail\">Email</label>\n    <input id=\"loginEmail\" type=\"email\" autocomplete=\"email\" placeholder=\"Your email\">\n    <label for=\"loginPassword\">Password</label>\n    <input id=\"loginPassword\" type=\"password\" autocomplete=\"current-password\" placeholder=\"Your password\">\n    <button id=\"loginButton\">Log in</button>\n    <button id=\"resetPasswordButton\" class=\"screen-back\">Forgot password?</button>\n  </section>\n\n  <section id=\"resetScreen\" style=\"display:none;\">\n    <h2>Choose a new password</h2>\n    <label for=\"newPassword\">New password</label>\n    <input id=\"newPassword\" type=\"password\" autocomplete=\"new-password\" minlength=\"8\">\n    <button id=\"newPasswordButton\">Update password</button>\n  </section>\n\n  \n  \n<script>\nconst params=new URLSearchParams(parent.location.search),mode=params.get('screen')||'wall';\nconst el=id=>document.getElementById(id);\ndocument.body.dataset.screen=mode;\n['wall','friendsScreen','profileScreen','peekScreen','communityScreen','signupScreen','loginScreen','resetScreen'].forEach(id=>el(id).style.display='none');\nel('photoWallFrame').hidden=mode!=='wall';el('intro').hidden=mode!=='wall';el('wallControls').hidden=mode!=='wall';el('wallBrowseControls').hidden=mode!=='wall';el('privateControls').hidden=true;\nif(mode==='wall'){el('wall').style.display='block';el('wall').innerHTML='';for(let i=0;i<6;i++){const c=document.createElement('div');c.className='polaroid';c.style.left=(5+i%3*17)+'%';c.style.top=(8+Math.floor(i/3)*25)+'%';c.style.transform='rotate('+(-5+i*2)+'deg)';c.innerHTML='<img alt=\"Sample photo\" src=\"data:image/svg+xml,'+encodeURIComponent('<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"300\" height=\"300\"><rect width=\"300\" height=\"300\" fill=\"'+['#739b9d','#c78b73','#9688b3'][i%3]+'\"/><circle cx=\"210\" cy=\"75\" r=\"35\" fill=\"#f8e4b7\"/><path d=\"M0 300L130 130L300 300Z\" fill=\"#436868\"/></svg>')+'\"><div class=\"polaroid-caption\">A good day</div><button class=\"share-card\">Share</button><button class=\"trash\" aria-label=\"Hide sample photo\">\u00d7</button>';el('wall').append(c);}}\nelse el(mode+'Screen').style.display='block';\nif(mode==='community'){el('communityWall').innerHTML='';for(let i=0;i<9;i++){const card=document.createElement('article');card.className='community-card';card.style.setProperty('--card-tilt',(-2+i%4)+'deg');card.innerHTML='<div class=\"community-photo-error\">Sample photo</div><p class=\"community-caption\">Good times</p><p class=\"community-author\">@sample_member</p><time>19/10/2026</time><div class=\"community-card-actions\"><button>Report</button><button>Block</button></div>';el('communityWall').append(card);}}\nif(mode==='profile'){el('accountStatus').textContent='Logged in as sample@example.com';el('username').value='sample_member';}\nif(mode==='friends'){el('friendRequests').innerHTML='<div><p>A friend wants to connect.</p><button>Accept</button><button>Decline</button></div>';el('privateWallInvites').innerHTML='<div><p>Someone invited you to their locked wall.</p><button>View locked wall</button></div>';}\nif(params.get('tools'))el('personaliseWall').open=true;\nif(params.get('capture')){el('capturePanel').classList.add('open','has-photo');document.body.classList.add('capture-open');el('photoPreview').innerHTML='<div style=\"width:100%;height:220px;background:#739b9d;display:grid;place-items:center\">Sample photo</div>';el('momentCaption').value='Good times';}\nfunction showScreen(screen){parent.location.search=new URLSearchParams({width:params.get('width')||'390',screen}).toString();}\nfunction openCapture(){parent.location.search=new URLSearchParams({width:params.get('width')||'390',screen:'wall',capture:'1'}).toString();}\nfunction closeCapture(){showScreen('wall');}\n<\/script></body>\n</html>\n\n\n"</script></body></html>
